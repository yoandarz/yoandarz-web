<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoan Darz | Musician & Events</title>
  <meta name="description" content="Yoan Darz: música en vivo, DJ, sonido, coctelería y servicios para eventos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>
  <main class="home-shell">
    <section class="brand-choice musician-choice" aria-label="Entrar a Yoan Darz Musician">
      <div class="choice-overlay"></div>

      <div class="choice-content">
        <img class="choice-logo musician-logo" src="assets/img/logos/logo-musician.png" alt="Logo Yoan Darz Musician">

        <p class="choice-kicker">Música en vivo</p>
        <h1>Yoan Darz Musician</h1>
        <p class="choice-text">Música completamente en vivo para ceremonias, bodas y momentos especiales.</p>

        <a class="choice-button musician-button" href="musician/index.html">Entrar a Musician</a>
      </div>
    </section>

    <section class="brand-choice events-choice" aria-label="Entrar a Yoan Darz Events">
      <div class="choice-overlay"></div>

      <div class="choice-content">
        <img class="choice-logo events-logo" src="assets/img/logos/logo-events.png" alt="Logo Yoan Darz Events">

        <p class="choice-kicker">Servicios para eventos</p>
        <h2>Yoan Darz Events</h2>
        <p class="choice-text">DJ, sonido, coctelería y servicios para bodas, fiestas y eventos privados.</p>

        <a class="choice-button events-button" href="events/index.html">Entrar a Events</a>
      </div>
    </section>
  </main>
</body>
</html>
